name: Rerun failed tile builds

# When "Build and deploy POI tiles" fails, rerun its failed jobs (which also
# reruns merge-and-deploy after them), up to two more times. Most failures
# so far were one region job landing on a runner that couldn't reach
# Geofabrik at all (see the reachability check in build-tiles.yml); a rerun
# gets a new runner, and on 2026-11-27 rerunning by hand fixed exactly that.
#
# Only a run that failed. A run whose jobs were only cancelled (by hand, or
# by hitting their timeout) ends as "cancelled" and isn't retried, since
# repeating up to 350 minutes of slow downloads is unlikely to go
# differently. If a run has both, the run is "failure", and the rerun
# repeats the timed-out jobs too; the attempt limit bounds that.

on:
  workflow_run:
    workflows: ["Build and deploy POI tiles"]
    types: [completed]
    branches: [master]

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "Run $RUN_ID failed on attempt $ATTEMPT; rerunning its failed jobs."
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
